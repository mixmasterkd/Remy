# Modèle inactif : aucun déploiement tant que ce fichier reste dans docs/.
# Pour publier plus tard : copier dans .github/workflows/pages.yml,
# sélectionner GitHub Actions dans Settings > Pages, puis lancer manuellement.
name: Publier Remy manuellement
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
