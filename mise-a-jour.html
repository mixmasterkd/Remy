<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="remy-build" content="remy-cab7094967d6e1f3"><title>Actualiser Remy</title>
<style>body{margin:0;padding:32px;font:16px/1.6 Arial,sans-serif;background:#f5f4f0;color:#252940}main{max-width:480px;margin:12vh auto}h1{font-size:28px;letter-spacing:-1px}a{color:#303992}p{margin:20px 0}</style>
</head>
<body><main><h1>Actualisation de Remy</h1><p id="status" role="status">Recherche de la dernière version… Tes séances faites sont conservées.</p><a href="./">Retour au calendrier</a></main>
<script type="module">
const expected=document.querySelector('meta[name="remy-build"]').content,status=document.getElementById('status');
let finished=false,interval,timeout;
function done(){if(finished)return;finished=true;clearInterval(interval);clearTimeout(timeout);location.replace('./');}
if('serviceWorker' in navigator&&window.isSecureContext){
  navigator.serviceWorker.addEventListener('message',event=>{if(event.data?.type==='REMY_VERSION'){event.ports?.[0]?.postMessage({handled:true});if(event.data.version===expected)done();}});
  const ask=()=>navigator.serviceWorker.controller?.postMessage({type:'REMY_HELLO'});
  navigator.serviceWorker.addEventListener('controllerchange',ask);
  try {
    const registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
    await registration.update();await navigator.serviceWorker.ready;ask();
    if(!finished){interval=setInterval(ask,500);timeout=setTimeout(()=>{clearInterval(interval);status.textContent='La mise à jour n’a pas terminé. Vérifie ta connexion et recharge cette page. Tes séances faites sont conservées.';},15000);}
  } catch {status.textContent='Une connexion est nécessaire pour actualiser Remy. Tes séances faites sont conservées.';}
} else status.textContent='Ouvre cette adresse dans Chrome avec une connexion pour actualiser Remy.';
</script></body></html>
